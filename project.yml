name: PRIVET
options:
  bundleIdPrefix: su.wvw.svt
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  PRIVET:
    type: application
    platform: iOS
    sources:
      - PRIVET
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: su.wvw.svt.privet
        PRODUCT_NAME: PRIVET
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: PRIVET/Info.plist
      properties:
        CFBundleDisplayName: PRIVET
        UILaunchScreen:
          UIColorName: LaunchBG
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Микрофон нужен для голосовых сообщений и звонков.
        NSCameraUsageDescription: Камера нужна для фото, видеокружков и звонков.
        NSPhotoLibraryUsageDescription: Доступ к фото нужен, чтобы отправлять их в чат.
        ITSAppUsesNonExemptEncryption: false
